services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: herokids
    ports:
      - "5432:5432"
    volumes:
      - herokids_pgdata:/var/lib/postgresql/data

volumes:
  herokids_pgdata:
